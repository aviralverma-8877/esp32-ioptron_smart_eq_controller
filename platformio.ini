; ESP32 RJ9 Adapter - Bluetooth SPP <-> RS-232 bridge + status TFT + GPS sync
;
;   BT SPP client <--RFCOMM--> ESP32 UART2 (GPIO17 TX / GPIO16 RX) <--> MAX3232 <--> RJ9 -> mount
;   TFT: ST7789 320x240 landscape, hardware SPI/VSPI (SCLK18 MOSI23 MISO19 CS25 DC26 RST27).
;   GPS: ATK-NEO-6M, NMEA in on GPIO32 (UART1 RX).   BTN1 GPIO39.   LED2 GPIO2 = mount-link.
;   USB-C / CH340G / UART0 = debug log only.
;
; Board: ESP32-WROOM-32 (U26). Verified: iOptron SmartEQ Pro (MountInfo 0011) @ 9600 8N1.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

board_build.partitions = huge_app.csv     ; Bluedroid SPP needs the 3 MB app layout

monitor_speed = 115200
upload_speed = 921600

; after each build, merge a single flashable image into docs/firmware/ for the
; browser web-flasher (docs/index.html, served by GitHub Pages)
extra_scripts = post:scripts/merge_bin.py

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
    mikalhart/TinyGPSPlus@^1.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DDEBUG_LOG=1                   ; bridge status log on UART0 @ 115200 (0 to silence)
    -DBRIDGE_BAUD=9600              ; iOptron legacy command set
    -DRS232_RX_PIN=16
    -DRS232_TX_PIN=17
    -DACT_LED_PIN=2                 ; LED2 - lit while the mount link is up
    -DGPS_RX_PIN=32                 ; NEO-6M TX -> here (UART1 RX, receive-only)
    -DBTN_SYNC_PIN=39              ; BTN1, active-low, ext. pull-up
    -DTFT_CS=25
    -DTFT_DC=26
    -DTFT_RST=27
    -DTFT_HZ=24000000             ; TFT SPI clock; lower to 16000000-20000000 if wiring is flaky
    -DTFT_INVERT=0                 ; ST7789 colour inversion (0/1) - flip if colours look wrong
    '-DBT_NAME="SmartEQ-RJ9"'
